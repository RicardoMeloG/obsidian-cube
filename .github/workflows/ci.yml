name: CI

on:
  # Every branch, whatever its prefix: a stage's branch is gated by CI, not by
  # the runs its commit messages declare (audit-3 F-1, 2026-10-16; the
  # trigger is tested by scripts/checks/ciWorkflow.test.ts).
  push:
    branches: ["**"]
  pull_request:
  # While the site is being built (owner, 2026-10-16), the heavy checks run on
  # demand: the full viewport matrix and the contrast over the worlds, whose
  # software WebGL took 30 to 36 minutes of a 40-minute run. No nightly run:
  # it re-checked an unchanged main. Whether they return on every push or on
  # a schedule is decided at the release stage's entry (docs/roadmap.md).
  workflow_dispatch:
    inputs:
      full:
        description: Full viewport matrix (9 sizes)
        type: boolean
        default: false
      worlds:
        description: Contrast of name and role over every world (software WebGL, about 35 minutes)
        type: boolean
        default: false

# A newer push to a branch cancels the run it made stale; a manual run is
# never cancelled by a push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Gates of spec 010 (docs/architecture.md, "Rules and their gates"). The CDK
# synth runs only when infra/ changes (infra.yml).
jobs:
  frontend:
    name: Audit · Lint · Types · Test · Build · Budget · Privacy · Docs · Tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run typecheck:server
      - run: npm test
      - run: npm run build
      - run: npm run check:budget
      - run: npm run check:privacy
        env:
          # Owner's private values, one per line; never committed.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      - run: npm run check:docs
      - run: npm run check:tokens

  layout:
    name: Layout · Accessibility
    # Playwright 1.60 cannot install Chromium on ubuntu-26.04, which
    # ubuntu-latest selected on 2026-11-08. Keep the browser OS explicit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Layout check (default matrix, every layout mode; on demand, the full matrix and the worlds)
        run: npm run check:layout -- ${{ inputs.full && '--full' || '' }} ${{ inputs.worlds && '--worlds' || '' }}
      - name: Layout check with every field at its budget
        run: npm run check:layout -- --content=stress ${{ inputs.full && '--full' || '' }}
      - name: Admin form round-trips every document (spec 011, AD-04)
        run: npm run check:admin
      - name: Keep the layout evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-report
          path: layout-report/
          if-no-files-found: ignore
