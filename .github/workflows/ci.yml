name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  # Nightly: the layout check on the full viewport matrix.
  schedule:
    - cron: "0 6 * * *"

# Gates of spec 010 (docs/architecture.md, "Rules and their gates").
jobs:
  frontend:
    name: Lint · Types · Test · Build · Budget · Privacy · Docs · Tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:server
      - run: npm test
      - run: npm run build
      - run: npm run check:budget
      - run: npm run check:privacy
        env:
          # Owner's private values, one per line; never committed.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      - run: npm run check:docs
      - run: npm run check:tokens

  layout:
    name: Layout · Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Layout check (PR matrix, full matrix at night)
        run: npm run check:layout -- ${{ github.event_name == 'schedule' && '--full' || '' }}
      - name: Layout check with every field at its budget
        run: npm run check:layout -- --content=stress ${{ github.event_name == 'schedule' && '--full' || '' }}
      - name: Admin form round-trips every document (spec 011, AD-04)
        run: npm run check:admin
      - name: Keep the layout evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-report
          path: layout-report/
          if-no-files-found: ignore

  infra:
    name: CDK synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      # Offline synth: validates the infra compiles to CloudFormation.
      - run: npm run synth
