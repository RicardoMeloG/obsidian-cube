name: Deploy static site

# Publishes the built frontend to S3 + CloudFront, on demand only, from main
# (spec 010, D-6; dp-04). Two jobs:
#   build   no AWS access and no OIDC permission at all: it reads the owner's
#           published documents from the live site, builds and checks.
#   upload  the only job that can ask GitHub for an OIDC token. It runs in the
#           `production` environment, which waits for the owner's approval,
#           and takes the role of infra/lib/github-deploy-role.ts, which only
#           that environment of this repository can take.
# Until 2026-11-21 releases went out from the owner's machine
# (docs/deploy-aws.md, still the fallback).
on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a second one waits instead of racing the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit, not by a tag that can move (all on Node 24).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The repository has only the example content; the owner's published
      # documents are served by the site itself under /content/ (ADR 004:
      # the admin publishes them and invalidates the cache). The build renders
      # each page, llms.txt and the profile pages from them, so they come
      # first: without them the site would ship the example under the owner's
      # address. A missing document fails the step (curl --fail).
      - name: Fetch the published content
        run: |
          for doc in site.en site.es profile.en profile.es visual; do
            curl --fail --retry 3 --silent --show-error --proto '=https' "https://ricardomelog.com/content/$doc.json" -o "public/content/$doc.json"
          done

      - run: npm run build
      - run: npm run report:objective

      # Only the files the upload syncs: dist/content/ never goes to the
      # bucket, so it does not travel either.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site
          path: |
            dist/
            !dist/content/**
          retention-days: 1
          if-no-files-found: error

  upload:
    name: Upload & invalidate
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # OIDC: assume the deploy role, no long-lived AWS keys
    steps:
      # No checkout and no npm here: this job runs nothing from the repository
      # but the commands below.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # content/ belongs to the admin (ADR 004): a code deploy never uploads,
      # overwrites or deletes it (the role denies it too). Hashed chunks in
      # assets/ are uploaded first and never deleted, so a page opened before
      # this deploy can still lazy-load its chunks (spec 010, AD-09 and AD-11;
      # checked by deployWorkflow.test.ts).
      - name: Upload hashed assets
        run: aws s3 sync dist/assets/ "s3://${{ vars.SITE_BUCKET }}/assets/"

      - name: Sync the rest of the site
        run: >-
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}" --delete
          --exclude "content/*" --exclude "assets/*"

      - name: Invalidate CloudFront cache and wait
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --id "$id"
