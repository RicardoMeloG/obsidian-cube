name: Deploy static site

# Publishes the built frontend to S3 + CloudFront. Runs only on demand or on
# main, and only does anything once the AWS OIDC role + target vars are set.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC: assume the deploy role, no long-lived AWS keys
  contents: read

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # content/ belongs to the admin (ADR 004): a code deploy never uploads,
      # overwrites or deletes it. Hashed chunks in assets/ are uploaded first and
      # never deleted, so a page opened before this deploy can still lazy-load
      # its chunks (spec 010, AD-09 and AD-11; checked by deployWorkflow.test.ts).
      - name: Upload hashed assets
        run: aws s3 sync dist/assets/ "s3://${{ vars.SITE_BUCKET }}/assets/"

      - name: Sync the rest of the site
        run: >-
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}" --delete
          --exclude "content/*" --exclude "assets/*"

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
