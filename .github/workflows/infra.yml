name: Infra

# The CDK stack synthesises (docs/architecture.md, "Rules and their gates"),
# checked only when the infrastructure changes: nothing in infra/ moves while
# the site is being built (2026-10-16), and every run costs runner minutes.
on:
  push:
    branches: ["**"]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

jobs:
  infra:
    name: CDK synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      # Offline synth: validates the infra compiles to CloudFormation.
      - run: npm run synth
