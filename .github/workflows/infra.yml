name: Infra

# The CDK stack synthesises (docs/architecture.md, "Rules and their gates"),
# checked only when the infrastructure changes: nothing in infra/ moves while
# the site is being built (2026-10-16), and every run costs runner minutes.
on:
  push:
    branches: ["**"]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

jobs:
  infra:
    name: Audit · CDK synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm run prepare:cdk
      - run: npm ci
      - run: node --test scripts/security.test.mjs scripts/deploy-role.test.mjs scripts/waf-collector.test.mjs
      - run: npm audit --audit-level=low
      # Offline synth: validates the infra compiles to CloudFormation.
      - run: npm run synth
      # And with the visit logs on (spec 013, criterion 3): the delivery to S3
      # is only built under this context key, so the plain synth never sees it.
      - run: npm run synth -- -c visitLogs=true
