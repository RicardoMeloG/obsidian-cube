    <linearGradient id="top" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#342b52"/><stop offset="1" stop-color="#1a1529"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#7a6dff" stop-opacity=".55"/><stop offset="1" stop-color="#7a6dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7a6dff" stop-opacity=".8"/><stop offset="1" stop-color="#7a6dff" stop-opacity="0"/></radialGradient>
