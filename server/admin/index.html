<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Obsidian Cube — Admin</title>
  <style>
    :root {
      --bg: #08050d; --panel: #12101b; --panel-2: #1a1726; --line: #2a2740;
      --text: #e4eff8; --muted: #9a94b8; --accent: #b8aeff;
      --ok: #89d6c7; --err: #ff7a7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 "Inter", system-ui, sans-serif; height: 100vh;
      display: grid; grid-template-rows: auto 1fr;
    }
    header {
      display: flex; align-items: center; gap: 16px; padding: 12px 20px;
      border-bottom: 1px solid var(--line); background: var(--panel);
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.5px; }
    header .spacer { flex: 1; }
    select, button {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #0b0713; border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: default; }
    main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
    .editor, .preview { display: flex; flex-direction: column; min-height: 0; }
    .editor { border-right: 1px solid var(--line); }
    .toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    textarea {
      flex: 1; resize: none; border: 0; outline: none; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 13px/1.6 "JetBrains Mono", ui-monospace, monospace;
    }
    #status {
      padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px;
      max-height: 30vh; overflow: auto; background: var(--panel);
    }
    #status .ok { color: var(--ok); }
    #status .err { color: var(--err); }
    #status ul { margin: 6px 0 0; padding-left: 18px; }
    #status code { color: var(--accent); }
    .preview .toolbar { justify-content: space-between; }
    iframe { flex: 1; border: 0; background: #000; }
    .hint { color: var(--muted); font-size: 12px; }
    .hidden { display: none !important; }
    .auth-overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; }
    .auth-card { width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
    .auth-card h2 { margin: 0 0 4px; font-size: 18px; }
    .auth-card p.sub { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
    .auth-card label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
    .auth-card input { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; }
    .auth-card button { width: 100%; margin-top: 18px; }
    .auth-card .qr { display: block; margin: 12px auto; width: 180px; height: 180px; background: #fff; border-radius: 8px; }
    .auth-card .secret { font: 12px ui-monospace, monospace; color: var(--accent); word-break: break-all; text-align: center; }
    .auth-msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .auth-msg.err { color: var(--err); } .auth-msg.ok { color: var(--ok); }
  </style>
</head>
<body>
  <header>
    <h1>◈ OBSIDIAN CUBE — ADMIN</h1>
    <select id="doc"></select>
    <span class="spacer"></span>
    <span class="hint" id="whoami"></span>
    <button id="logout" class="hidden">Salir</button>
  </header>

  <div id="auth" class="auth-overlay hidden">
    <div class="auth-card">
      <h2>◈ Obsidian Cube — Admin</h2>
      <p class="sub" id="authSub">Inicia sesión para editar el contenido.</p>

      <div id="view-login">
        <label>Usuario</label>
        <input id="u" autocomplete="username" />
        <label>Contraseña</label>
        <input id="p" type="password" autocomplete="current-password" />
        <button class="primary" id="doLogin">Entrar</button>
      </div>

      <div id="view-mfa" class="hidden">
        <label>Código de tu app autenticadora (TOTP)</label>
        <input id="mfaToken" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" />
        <button class="primary" id="doMfa">Verificar</button>
      </div>

      <div id="view-enroll" class="hidden">
        <p class="sub">Escanea el QR con Google/Microsoft Authenticator y escribe el código para activar MFA.</p>
        <img id="qr" class="qr" alt="QR TOTP" />
        <div class="secret" id="secret"></div>
        <label>Código generado</label>
        <input id="enrollToken" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" />
        <button class="primary" id="doEnroll">Activar MFA</button>
      </div>

      <div class="auth-msg" id="authMsg"></div>
    </div>
  </div>

  <main>
    <section class="editor">
      <div class="toolbar">
        <button id="reload">Recargar</button>
        <button id="validate">Validar</button>
        <button id="saveDraft">Guardar borrador</button>
        <button id="publish" class="primary">Publicar</button>
        <span class="hint" id="source"></span>
      </div>
      <div class="toolbar">
        <span class="hint">Versiones:</span>
        <select id="versions"><option value="">— sin BD / sin versiones —</option></select>
        <button id="restore">Restaurar</button>
      </div>
      <textarea id="content" spellcheck="false"></textarea>
      <div id="status" class="hint">Cargando…</div>
    </section>

    <section class="preview">
      <div class="toolbar">
        <span class="hint">Preview · localhost:5180 (requiere <code>npm run dev</code>)</span>
        <button id="refreshPreview">↻ Recargar preview</button>
      </div>
      <iframe id="preview" src="http://localhost:5180/?lang=es"></iframe>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const docSel = $('doc'), ta = $('content'), status = $('status'), source = $('source');
    let currentDoc = null;

    function setStatus(html, cls) {
      status.className = cls || 'hint';
      status.innerHTML = html;
    }

    function parseEditor() {
      try { return { ok: true, data: JSON.parse(ta.value) }; }
      catch (e) { return { ok: false, error: e.message }; }
    }

    function renderErrors(errors) {
      const items = errors.map((e) => `<li><code>${e.path}</code> — ${e.message}</li>`).join('');
      setStatus(`<span class="err">✗ Inválido (${errors.length})</span><ul>${items}</ul>`, '');
    }

    async function loadDocs() {
      const docs = await (await fetch('/api/docs')).json();
      docSel.innerHTML = docs.map((d) => `<option value="${d.id}">${d.label}</option>`).join('');
      currentDoc = docs[0]?.id;
      await loadDoc();
    }

    async function loadDoc() {
      currentDoc = docSel.value || currentDoc;
      const res = await fetch(`/api/content/${currentDoc}`);
      const body = await res.json();
      ta.value = JSON.stringify(body.data, null, 2);
      source.textContent = `origen: ${body.source}`;
      setStatus('Cargado. Edita y valida antes de publicar.', 'hint');
      await loadVersions();
    }

    async function loadVersions() {
      const sel = $('versions');
      const res = await fetch(`/api/content/${currentDoc}/versions`);
      if (!res.ok) { sel.innerHTML = '<option value="">— sin BD / sin versiones —</option>'; return; }
      const list = await res.json();
      sel.innerHTML = list.length
        ? list.map((v) => `<option value="${v.id}">#${v.id} · ${new Date(v.publishedAt).toLocaleString()}</option>`).join('')
        : '<option value="">— aún sin versiones —</option>';
    }

    async function saveDraft() {
      const parsed = parseEditor();
      if (!parsed.ok) return setStatus(`<span class="err">✗ JSON malformado:</span> ${parsed.error}`, '');
      const res = await fetch(`/api/content/${currentDoc}/draft`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(parsed.data),
      });
      const out = await res.json();
      if (res.ok && out.ok) return setStatus('<span class="ok">✓ Borrador guardado en la BD.</span>', '');
      setStatus(`<span class="err">✗ ${out.message || 'No se pudo guardar'}</span>`, '');
    }

    async function restore() {
      const id = $('versions').value;
      if (!id) return setStatus('<span class="err">✗ No hay versión seleccionada.</span>', '');
      const res = await fetch(`/api/content/${currentDoc}/restore/${id}`, { method: 'POST' });
      const out = await res.json();
      if (res.ok && out.data) {
        ta.value = JSON.stringify(out.data, null, 2);
        return setStatus(`<span class="ok">✓ Versión #${id} restaurada al borrador.</span>`, '');
      }
      setStatus(`<span class="err">✗ ${out.message || 'No se pudo restaurar'}</span>`, '');
    }

    async function validate() {
      const parsed = parseEditor();
      if (!parsed.ok) return setStatus(`<span class="err">✗ JSON malformado:</span> ${parsed.error}`, '');
      const res = await fetch(`/api/content/${currentDoc}/validate`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(parsed.data),
      });
      const out = await res.json();
      if (out.ok) return setStatus('<span class="ok">✓ Válido contra el schema.</span>', '');
      renderErrors(out.errors || []);
    }

    async function publish() {
      const parsed = parseEditor();
      if (!parsed.ok) return setStatus(`<span class="err">✗ JSON malformado:</span> ${parsed.error}`, '');
      const res = await fetch(`/api/content/${currentDoc}/publish`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(parsed.data),
      });
      const out = await res.json();
      if (res.ok && out.ok) {
        const v = out.version ? ` · versión #${out.version.id}` : ' · (sin BD: sin versión)';
        setStatus(`<span class="ok">✓ Publicado en ${out.file}${v}.</span> Recargando preview…`, '');
        $('preview').contentWindow.location.reload();
        await loadVersions();
      } else {
        renderErrors((out.errors) || (out.message && out.message.errors) || []);
      }
    }

    docSel.addEventListener('change', loadDoc);
    $('reload').addEventListener('click', loadDoc);
    $('validate').addEventListener('click', validate);
    $('saveDraft').addEventListener('click', saveDraft);
    $('publish').addEventListener('click', publish);
    $('restore').addEventListener('click', restore);
    $('refreshPreview').addEventListener('click', () => $('preview').contentWindow.location.reload());

    // ---- Auth gate ----
    const authMsg = (t, cls) => { const m = $('authMsg'); m.className = 'auth-msg ' + (cls || ''); m.textContent = t; };
    const showView = (name) => ['login', 'mfa', 'enroll'].forEach((v) => $('view-' + v).classList.toggle('hidden', v !== name));
    const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });

    function showAuth(view) { $('auth').classList.remove('hidden'); $('logout').classList.add('hidden'); showView(view); authMsg(''); }

    async function enterApp() {
      const me = await (await fetch('/auth/me')).json();
      $('whoami').textContent = me.username ? `Conectado: ${me.username}` : '';
      $('auth').classList.add('hidden');
      $('logout').classList.remove('hidden');
      await loadDocs();
    }

    async function startEnroll() {
      const r = await post('/auth/enroll/start');
      const out = await r.json();
      if (!r.ok) return authMsg(out.message || 'Error', 'err');
      $('qr').src = out.qrDataUrl; $('secret').textContent = out.secret;
      showView('enroll'); authMsg('');
    }

    $('doLogin').onclick = async () => {
      const r = await post('/auth/login', { username: $('u').value, password: $('p').value });
      const out = await r.json();
      if (!r.ok) return authMsg(out.message || 'Error', 'err');
      if (out.mfaRequired) { showView('mfa'); authMsg('Introduce el código de tu app.'); }
      else if (out.enrollRequired) { authMsg('Primer ingreso: activa MFA.'); await startEnroll(); }
    };
    $('doMfa').onclick = async () => {
      const r = await post('/auth/mfa', { token: $('mfaToken').value });
      const out = await r.json();
      if (r.ok && out.ok) return enterApp();
      authMsg(out.message || 'Código inválido', 'err');
    };
    $('doEnroll').onclick = async () => {
      const r = await post('/auth/enroll/verify', { token: $('enrollToken').value });
      const out = await r.json();
      if (r.ok && out.ok) return enterApp();
      authMsg(out.message || 'Código inválido', 'err');
    };
    $('logout').onclick = async () => { await post('/auth/logout'); location.reload(); };

    async function boot() {
      try {
        const me = await (await fetch('/auth/me')).json();
        if (me.authenticated) { await enterApp(); } else { showAuth('login'); }
      } catch (e) { showAuth('login'); authMsg('No se pudo contactar al servidor.', 'err'); }
    }
    boot();
  </script>
</body>
</html>
